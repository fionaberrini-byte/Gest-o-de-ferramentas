<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2635;--muted:#6e7b8c;--line:#e5e9ef;--blue:#386df4;--nav:#121b2a;--green:#178567;--amber:#b77415;--red:#c6424c;--shadow:0 8px 28px #1722380b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;padding:20px 14px;background:var(--nav);color:#dce3ed;display:flex;flex-direction:column;overflow:auto;z-index:4}.brand{display:flex;align-items:center;gap:11px;color:#fff;font-size:17px;font-weight:800;padding:4px 10px 22px}.brand-icon{height:38px;width:38px;border-radius:12px;background:#386df4;display:grid;place-items:center;font-size:20px}.nav-label{padding:12px 11px 7px;color:#8190a5;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800}.nav{display:grid;gap:4px}.nav button,.sector-nav{border:0;background:transparent;color:#aeb9c9;text-align:left;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:11px;font-weight:650;font-size:13px}.nav button:hover,.nav button.active,.sector-nav:hover,.sector-nav.active{background:#ffffff14;color:white}.nav-ico{width:20px;text-align:center;font-size:16px}.sector-list{display:grid;gap:2px}.sector-nav{padding:7px 11px;font-size:12px}.sector-dot{width:7px;height:7px;background:#6f8fbe;border-radius:50%}.side-note{margin-top:auto;border-top:1px solid #ffffff20;padding:14px 10px 2px;color:#91a0b3;font-size:10px}.main{margin-left:248px;min-height:100vh}.topbar{height:64px;position:sticky;top:0;z-index:3;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;backdrop-filter:blur(8px)}.crumb{font-size:12px;color:var(--muted)}.top-tag{font-size:11px;color:var(--muted)}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eaf0ff;color:var(--blue);font-weight:800}.top-right{display:flex;align-items:center;gap:11px}.content{max-width:1320px;margin:auto;padding:28px 30px 60px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);font-weight:800}.heading h1{font-size:27px;letter-spacing:-.6px;margin:4px 0}.heading p{color:var(--muted);font-size:13px;margin:0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;color:var(--ink);font-size:12px;font-weight:700;box-shadow:0 1px 2px #00000007}.btn:hover{border-color:#bac6d7}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red)}.btn.sm{padding:6px 8px;font-size:11px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{padding:16px 17px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--shadow)}.metric-label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:650}.metric-icon{width:30px;height:30px;border-radius:9px;background:#eff3ff;display:grid;place-items:center;color:var(--blue);font-size:15px}.metric strong{display:block;font-size:26px;margin-top:8px;letter-spacing:-.4px}.metric small{color:var(--muted);font-size:11px}.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:15px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head h2{font-size:15px;margin:0}.panel-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.sector-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.sector-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;transition:.15s}.sector-card:hover{border-color:#b9cbff;transform:translateY(-1px)}.sector-top{display:flex;align-items:center;gap:10px}.sector-icon{width:35px;height:35px;border-radius:10px;background:#eff3ff;color:var(--blue);display:grid;place-items:center;font-size:16px}.sector-card h3{font-size:12px;margin:0}.sector-card small{color:var(--muted);font-size:10px}.sector-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:10px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;background:#eaf6f1;color:var(--green);font-size:10px;font-weight:750;white-space:nowrap}.badge.warn{background:#fff5e5;color:var(--amber)}.badge.bad{background:#fff0f1;color:var(--red)}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}.list{display:grid}.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:11px 0}.list-row:first-child{border-top:0;padding-top:0}.list-title{font-weight:700;font-size:12px}.list-sub{font-size:10px;color:var(--muted);margin-top:3px}.search{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:220px;outline:none}.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#86a4ff;box-shadow:0 0 0 3px #386df41a;outline:none}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:630px}.table th{text-align:left;padding:9px 8px;color:var(--muted);font-size:9px;letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--line)}.table td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:11px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.tool-title{font-size:12px;font-weight:750}.sub{font-size:10px;color:var(--muted);margin-top:2px}.photo{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f1f4f8;flex:none}.photo-line{display:flex;align-items:center;gap:9px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;font-size:11px;font-weight:750;white-space:nowrap}.tab.active{color:var(--blue);border-color:var(--blue)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:11px;font-weight:700;color:#536072}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:white;padding:9px 10px;color:var(--ink)}.field textarea{min-height:74px;resize:vertical}.modal-layer{position:fixed;inset:0;background:#10182788;display:none;place-items:center;padding:16px;z-index:10}.modal-layer.open{display:grid}.modal{background:#fff;border-radius:15px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 22px 70px #0004}.modal-titlebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-titlebar h2{font-size:18px;margin:0}.close{border:0;border-radius:50%;background:#f0f2f5;width:30px;height:30px;font-size:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.hint{font-size:10px;color:var(--muted)}.toast{position:fixed;z-index:20;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#152033;color:#fff;border-radius:9px;padding:10px 14px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.work-card{border-top:1px solid var(--line);padding:12px 0}.work-card:first-child{border-top:0}.work-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.work-title{font-weight:750;font-size:12px}.work-meta{color:var(--muted);font-size:10px;margin-top:4px}.work-detail{font-size:11px;color:#536072;margin-top:8px;white-space:pre-wrap}.print-sheet{display:none}
@media(max-width:1000px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:25px 20px}.sector-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.sidebar{position:fixed;inset:0 0 auto;width:100%;height:auto;padding:8px 10px;display:block;overflow:visible}.brand{padding:0 3px 7px;font-size:14px}.brand-icon{width:30px;height:30px}.nav-label,.sector-list,.side-note{display:none}.nav{display:flex;overflow-x:auto;gap:3px}.nav button{flex:none;padding:7px 8px;font-size:0}.nav-ico{font-size:15px;width:auto}.main{margin:0;padding-top:80px}.topbar{height:42px;padding:0 14px}.top-tag{display:none}.content{padding:20px 13px 35px}.heading{display:block}.heading h1{font-size:23px}.heading .actions{margin-top:12px}.metric-grid{gap:8px}.metric{padding:12px}.metric strong{font-size:22px}.panel{padding:14px}.sector-grid{gap:7px}.sector-card{padding:10px}.sector-card h3{font-size:11px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%;min-width:0}.form-grid{grid-template-columns:1fr}.work-head{display:block}.work-head .actions{margin-top:8px}}
@media print{body{background:white}.app,.modal-layer,.toast{display:none!important}.print-sheet{display:block!important;position:absolute;inset:0;padding:10mm;font:11px Arial,sans-serif;color:#17212f}.print-sheet h1{font-size:20px;margin:0 0 5px}.print-sheet p{color:#586476;margin:0 0 12px}.print-meta{font-size:9px;color:#586476;margin-bottom:14px}.print-sheet table{border-collapse:collapse;width:100%}.print-sheet th,.print-sheet td{border:1px solid #d8dee8;padding:6px;text-align:left;vertical-align:top;font-size:9px}.print-sheet th{background:#eef2f7;text-transform:uppercase;font-size:8px}.print-foot{font-size:9px;color:#667085;margin-top:12px}tr{break-inside:avoid}}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">⚒</div><span>Oficina<span style="color:#87a7ff">+</span></span></div><div class="nav-label">Menu principal</div><nav class="nav"><button data-page="home"><span class="nav-ico">▦</span>Visão geral</button><button data-page="tools"><span class="nav-ico">▤</span>Ferramentas</button><button data-page="assets"><span class="nav-ico">▣</span>Ativos</button><button data-page="made"><span class="nav-ico">✚</span>Criadas pela manutenção</button><button data-page="repairs"><span class="nav-ico">◷</span>Assistência técnica</button><button data-page="orders"><span class="nav-ico">☷</span>Ordens de serviço</button></nav><div class="nav-label">Setores</div><div class="sector-list" id="sector-list"></div><div class="side-note">Os registros ficam salvos neste navegador.<br>Exporte backups regularmente.</div></aside><main class="main"><header class="topbar"><div class="crumb" id="crumb">Oficina+ / Visão geral</div><div class="top-right"><span class="top-tag">Gestão de ferramentas</span><div class="avatar">OF</div></div></header><div class="content" id="content"></div></main></div>
<div class="modal-layer" id="modal-layer"><section class="modal" role="dialog" aria-modal="true"><div class="modal-titlebar"><h2 id="modal-title"></h2><button class="close" id="modal-close">×</button></div><div id="modal-body"></div></section></div><div class="toast" id="toast"></div><section class="print-sheet" id="print-sheet"></section>
<script>
(()=>{'use strict';
const SECTORS=['Manutenção','Acabamento 1','Acabamento 2','Laminação 1','Laminação 2','CNC','Marcenaria','Tecelagem'];
const ICONS={'Manutenção':'⚙','Acabamento 1':'✧','Acabamento 2':'✦','Laminação 1':'▱','Laminação 2':'▰','CNC':'⌘','Marcenaria':'▧','Tecelagem':'▦'};
const KEY='oficina_plus_single_html_v3';let state=readState(),page='home',sector='Manutenção',sectorTab='stock',repairFilter='open',search='';
const $=s=>document.querySelector(s),content=$('#content');
function readState(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tools))return{tools:x.tools,repairs:Array.isArray(x.repairs)?x.repairs:[],moves:Array.isArray(x.moves)?x.moves:[],orders:Array.isArray(x.orders)?x.orders:[]}}catch(e){}return{tools:[],repairs:[],moves:[],orders:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Armazenamento cheio. Exporte os dados e reduza fotos para continuar.')}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function datePt(d){if(!d)return'—';let x=new Date(d.length===10?d+'T12:00:00':d);return isNaN(x)?esc(d):x.toLocaleDateString('pt-BR')}
function qty(t,s){return Number(t.stock&&t.stock[s]||0)}function tool(id){return state.tools.find(t=>t.id===id)}function toolLabel(id){let t=tool(id);return t?t.name:'Não vinculada'}function allQty(){return state.tools.reduce((n,t)=>n+Object.values(t.stock||{}).reduce((a,b)=>a+(+b||0),0),0)}function openRepairs(){return state.repairs.filter(r=>r.status!=='Concluída')}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sector-list').innerHTML=SECTORS.map(s=>`<button class="sector-nav ${page==='sector'&&sector===s?'active':''}" data-sector="${esc(s)}"><i class="sector-dot"></i>${esc(s)}</button>`).join('');document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>openSector(b.dataset.sector));let names={home:'Visão geral',tools:'Ferramentas',assets:'Ativos da empresa',made:'Ferramentas criadas pela manutenção',repairs:'Assistência técnica',orders:'Ordens de serviço',sector:sector};$('#crumb').textContent='Oficina+ / '+names[page];document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;search='';render()}function openSector(s){sector=s;sectorTab='stock';page='sector';render()}
function render(){nav();if(page==='home')home();else if(page==='tools')toolList('standard');else if(page==='assets')toolList('asset');else if(page==='made')toolList('made');else if(page==='repairs')repairsPage();else if(page==='orders')ordersPage();else sectorPage()}
function btnReport(id,fn){let b=$('#'+id);if(b)b.onclick=fn}
function home(){let types=state.tools.filter(t=>t.type==='standard').length;content.innerHTML=`<div class="heading"><div><div class="kicker">Painel de controle</div><h1>Visão geral</h1><p>Resumo do estoque, setores, assistência e ordens de serviço.</p></div><div class="actions"><button class="btn" id="report">▤ PDF / Imprimir</button><button class="btn" id="backup">⇩ Exportar backup</button><button class="btn primary" id="new-tool">＋ Cadastrar ferramenta</button></div></div><div class="metric-grid"><div class="metric"><div class="metric-label">Ferramentas comuns <span class="metric-icon">▤</span></div><strong>${types}</strong><small>no catálogo geral</small></div><div class="metric"><div class="metric-label">Unidades nos setores <span class="metric-icon">⚒</span></div><strong>${allQty()}</strong><small>estoque distribuído</small></div><div class="metric"><div class="metric-label">Assistências abertas <span class="metric-icon">◷</span></div><strong>${openRepairs().length}</strong><small>aguardando ou em reparo</small></div><div class="metric"><div class="metric-label">OS em andamento <span class="metric-icon">☷</span></div><strong>${state.orders.filter(o=>o.status!=='Concluída').length}</strong><small>ordens de serviço</small></div></div><div class="layout"><section class="panel"><div class="panel-head"><div><h2>Estoque por setor</h2><p>Selecione um setor para consultar ou movimentar itens.</p></div></div><div class="sector-grid">${SECTORS.map(s=>{let n=state.tools.reduce((a,t)=>a+qty(t,s),0),r=state.repairs.filter(x=>x.sector===s&&x.status!=='Concluída').length;return`<article class="sector-card" data-open-sector="${esc(s)}"><div class="sector-top"><span class="sector-icon">${ICONS[s]}</span><div><h3>${esc(s)}</h3><small>${n} unidade(s)</small></div></div><div class="sector-foot"><span>${r?`<span class="badge warn">${r} assistência(s)</span>`:'Operação normal'}</span><span>›</span></div></article>`}).join('')}</div></section><div><section class="panel"><div class="panel-head"><div><h2>Assistência técnica</h2><p>Itens que aguardam reparo ou conclusão.</p></div><button class="btn sm" id="see-repairs">Ver todas</button></div>${repairRows(openRepairs().slice(0,4))}</section><section class="panel"><div class="panel-head"><div><h2>Movimentações recentes</h2><p>Últimas entradas e retiradas.</p></div></div>${moveRows(state.moves.slice(0,5))}</section></div></div>`;$('#new-tool').onclick=()=>toolModal('standard');$('#backup').onclick=backup;$('#report').onclick=()=>report('Resumo geral — Oficina+','Estoque e assistência por setor',['Setor','Unidades no estoque','Assistências abertas'],SECTORS.map(s=>[s,String(state.tools.reduce((a,t)=>a+qty(t,s),0)),String(state.repairs.filter(r=>r.sector===s&&r.status!=='Concluída').length)]));$('#see-repairs').onclick=()=>go('repairs');document.querySelectorAll('[data-open-sector]').forEach(b=>b.onclick=()=>openSector(b.dataset.openSector))}
function repairRows(items){return items.length?`<div class="list">${items.map(r=>`<div class="list-row"><div><div class="list-title">${esc(toolLabel(r.toolId))}</div><div class="list-sub">${esc(r.sector)} · ${datePt(r.date)}</div></div><span class="badge ${r.status==='Em reparo'?'warn':'bad'}">${esc(r.status)}</span></div>`).join('')}</div>`:`<div class="empty"><strong>Nenhuma assistência aberta</strong>Quando houver defeito, registre uma ordem.</div>`}
function moveRows(items){return items.length?`<div class="list">${items.map(m=>`<div class="list-row"><div><div class="list-title">${esc(m.toolName)}</div><div class="list-sub">${esc(m.sector)} · ${datePt(m.date)}${m.note?' · '+esc(m.note):''}</div></div><span class="badge ${m.action==='Retirada'?'warn':''}">${m.action==='Entrada'?'+':'−'}${m.qty} ${esc(m.action.toLowerCase())}</span></div>`).join('')}</div>`:`<div class="empty"><strong>Sem movimentações ainda</strong>Entradas e retiradas aparecerão aqui.</div>`}
function toolList(type){let labels={standard:['Ferramentas','Catálogo comum de ferramentas, sem nomes duplicados.'],asset:['Ativos da empresa','Máquinas e ferramentas de grande porte, separadas do catálogo comum.'],made:['Ferramentas criadas pela manutenção','Itens fabricados, adaptados ou desenvolvidos pela equipe de manutenção.']},[title,desc]=labels[type];let items=state.tools.filter(t=>t.type===type).filter(t=>!search||`${t.name} ${t.code||''} ${t.category||''}`.toLowerCase().includes(search.toLowerCase()));content.innerHTML=`<div class="heading"><div><div class="kicker">Cadastro e inventário</div><h1>${title}</h1><p>${desc}</p></div><div class="actions"><button class="btn" id="print">▤ PDF / Imprimir</button><button class="btn primary" id="create">＋ ${type==='asset'?'Cadastrar ativo':type==='made'?'Cadastrar ferramenta':'Nova ferramenta'}</button></div></div><section class="panel"><div class="toolbar"><input class="search" id="search" placeholder="Buscar por nome, código ou categoria…" value="${esc(search)}"><span class="badge">${items.length} cadastrada(s)</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Código / patrimônio</th><th>Categoria</th><th>Estoque total</th><th>Setores</th><th>Foto e ações</th></tr></thead><tbody>${items.length?items.map(t=>toolRow(t,type)).join(''):`<tr><td colspan="6"><div class="empty"><strong>${search?'Nenhum resultado':'Ainda não há itens cadastrados'}</strong>${search?'Revise a busca.':'Use o botão acima para criar o primeiro cadastro.'}</div></td></tr>`}</tbody></table></div></section>`;$('#create').onclick=()=>toolModal(type);$('#print').onclick=()=>report(`Relatório — ${title}`,desc,['Item','Código','Categoria','Total','Setores'],items.map(t=>[esc(t.name),esc(t.code||'—'),esc(t.category||'—'),String(Object.values(t.stock||{}).reduce((a,n)=>a+(+n||0),0)),Object.entries(t.stock||{}).filter(x=>+x[1]>0).map(([s,n])=>`${esc(s)} (${n})`).join(', ')||'—']));$('#search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;toolList(type);$('#search').focus();$('#search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-edit-tool]').forEach(b=>b.onclick=()=>toolModal(type,b.dataset.editTool));document.querySelectorAll('[data-launch-tool]').forEach(b=>b.onclick=()=>launchModal(b.dataset.launchTool))}
function toolRow(t,type){let total=Object.values(t.stock||{}).reduce((a,n)=>a+(+n||0),0),locations=Object.entries(t.stock||{}).filter(x=>+x[1]>0).map(([s,n])=>`${esc(s)} (${n})`).join(', ')||'—';return`<tr><td><div class="photo-line">${t.photo?`<img class="photo" src="${t.photo}" alt="Foto de ${esc(t.name)}">`:`<span class="photo" style="display:grid;place-items:center">📷</span>`}<div><div class="tool-title">${esc(t.name)}</div><div class="sub">${type==='asset'?'Ativo':type==='made'?'Produzida pela manutenção':'Ferramenta'}</div></div></div></td><td>${esc(t.code||'—')}</td><td>${esc(t.category||'—')}</td><td>${total}</td><td>${locations}</td><td><div class="actions"><button class="btn sm" data-edit-tool="${t.id}">Editar / foto</button><button class="btn sm" data-launch-tool="${t.id}">＋ Setor</button></div></td></tr>`}

function orderModal(id=''){let old=id?state.orders.find(o=>o.id===id):null,num=old?.number||'OS-'+String(state.orders.length+1).padStart(4,'0'),v=k=>esc(old?.[k]||'');modal(old?'Editar ordem de serviço':'Nova ordem de serviço',`<form id="modal-form"><div class="form-grid"><div class="field"><label>Número OS *</label><input name="number" value="${num}" required></div><div class="field"><label>Data *</label><input name="date" type="date" value="${esc(old?.date||new Date().toISOString().slice(0,10))}" required></div></div><div class="field"><label>Serviço / título *</label><input name="title" required maxlength="120" value="${v('title')}" placeholder="Ex.: Manutenção da prensa"></div><div class="form-grid"><div class="field"><label>Setor *</label><select name="sector">${SECTORS.map(s=>`<option ${old?.sector===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Solicitante / responsável</label><input name="requester" maxlength="90" value="${v('requester')}" placeholder="Nome"></div></div><div class="field"><label>Equipamento / ferramenta</label><select name="tool"><option value="">Não vincular</option>${state.tools.map(t=>`<option value="${t.id}" ${old?.toolId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Solicitação / problema identificado *</label><textarea name="description" required maxlength="1600" placeholder="Descreva o serviço solicitado e o problema identificado.">${v('description')}</textarea></div><div class="field"><label>Serviço executado / o que foi feito</label><textarea name="work" maxlength="2200" placeholder="Etapas realizadas, ajustes, testes e resultado.">${v('work')}</textarea></div><div class="form-grid"><div class="field"><label>Materiais / peças utilizados</label><input name="materials" maxlength="500" value="${v('materials')}" placeholder="Materiais e peças"></div><div class="field"><label>Tempo de trabalho (horas)</label><input name="hours" type="number" min="0" step="0.25" value="${v('hours')}" placeholder="Ex.: 1,5"></div></div><div class="form-grid"><div class="field"><label>Status</label><select name="status">${['Aberta','Em andamento','Concluída'].map(s=>`<option ${old?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Foto do serviço</label><input name="photo" type="file" accept="image/*" capture="environment">${old?.photo?'<span class="hint">Foto salva; escolha outra para substituir.</span>':''}</div></div><div class="field"><label>Observações finais</label><textarea name="notes" maxlength="1200" placeholder="Recomendações, pendências ou observações.">${v('notes')}</textarea></div><div class="modal-actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">${old?'Salvar alterações':'Salvar ordem'}</button></div></form>`,async f=>{let photo=await readPhoto(f.get('photo')),o={...(old||{}),id:old?.id||uid(),number:f.get('number').trim(),date:f.get('date'),title:f.get('title').trim(),sector:f.get('sector'),requester:f.get('requester').trim(),toolId:f.get('tool'),description:f.get('description').trim(),work:f.get('work').trim(),materials:f.get('materials').trim(),hours:f.get('hours'),status:f.get('status'),photo:photo||old?.photo||'',notes:f.get('notes').trim()};if(old)state.orders[state.orders.findIndex(x=>x.id===old.id)]=o;else state.orders.push(o);save();closeModal();render();toast('Ordem de serviço salva.')})}
function viewOrder(id){let o=state.orders.find(x=>x.id===id);if(!o)return;modal(`Ordem de serviço · ${o.number}`,`<p><b>${esc(o.title)}</b><br>${esc(o.sector)} · ${datePt(o.date)} · ${esc(o.status)}</p><p><b>Responsável:</b> ${esc(o.requester||'—')}<br><b>Equipamento:</b> ${esc(toolLabel(o.toolId))}<br><b>Horas:</b> ${esc(o.hours||'—')}</p><p><b>Solicitação / problema</b><div class="work-detail">${esc(o.description)}</div></p><p><b>Serviço executado</b><div class="work-detail">${esc(o.work||'Não informado')}</div></p><p><b>Materiais:</b> ${esc(o.materials||'—')}</p><p><b>Observações:</b><div class="work-detail">${esc(o.notes||'—')}</div></p>${o.photo?`<img style="max-width:100%;max-height:250px;border-radius:10px" src="${o.photo}" alt="Foto do serviço">`:''}<div class="modal-actions"><button class="btn" id="cancel">Fechar</button><button class="btn primary" id="edit-current">Editar OS</button></div>`,()=>{});$('#edit-current').onclick=()=>orderModal(id)}
function report(title,subtitle,headers,rows){let s=$('#print-sheet');s.innerHTML=`<h1>${esc(title)}</h1><p>${esc(subtitle)}</p><div class="print-meta">Emitido em ${new Date().toLocaleString('pt-BR')} · Oficina+</div><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">Nenhum registro encontrado.</td></tr>`}</tbody></table><div class="print-foot">Relatório gerado pelo Oficina+ · Gestão de ferramentas</div>`;setTimeout(()=>window.print(),100)}
function backup(){let blob=new Blob([JSON.stringify({app:'Oficina+',version:3,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oficina-plus-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup baixado.')}
